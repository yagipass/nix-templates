apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: nix-templates
  owner: yagipass
spec:
  description: Nix flake templates
  visibility: public
  archived: false
  topics:
  - java
  - maven
  - nix
  - nix-flakes
  - nix-templates
  - postgresql
  labels:
  - name: accessibility
    description: Barrier affecting people with disabilities
    color: f143ab
  - name: automated
    description: Created by GitHub Actions
    color: b590bf
  - name: bug
    description: Something isn't working
    color: d73a4a
  - name: dependencies
    description: Pull requests that update a dependency file
    color: 0366d6
  - name: documentation
    description: Improvements or additions to documentation
    color: 0075ca
  - name: duplicate
    description: This issue or pull request already exists
    color: cfd3d7
  - name: enhancement
    description: New feature or request
    color: a2eeef
  - name: good first issue
    description: Good for newcomers
    color: 7057ff
  - name: help wanted
    description: Extra attention is needed
    color: 008672
  - name: invalid
    description: This doesn't seem right
    color: e4e669
  - name: question
    description: Further information is requested
    color: d876e3
  - name: wontfix
    description: This will not be worked on
    color: ffffff
  features:
    issues: true
    projects: false
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: false
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true
  rulesets:
  - name: protect-main
    target: branch
    enforcement: active
    bypass_actors:
    - role: admin
      bypass_mode: pull_request
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      pull_request:
        required_approving_review_count: 0
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: true
      required_status_checks:
        strict_required_status_checks_policy: false
        contexts:
        - context: check
          app: github-actions
      non_fast_forward: true
      update: false
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: true
    fork_pr_approval: first_time_contributors
