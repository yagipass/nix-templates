name: Update flake.lock

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Update all template locks
        id: update
        run: |
          set -euo pipefail
          source .github/scripts/version-table.sh

          versions() {
            nix eval --json "./$1#devShells.x86_64-linux.default.nativeBuildInputs" \
              --apply 'ps: map (p: { name = p.pname or p.name; version = p.version or null; }) ps' \
              | jq -c 'map(select(.version != null))'
          }

          rows=""
          for dir in java*-maven; do
            echo "== $dir"
            before=$(versions "$dir")
            nix flake update --flake "./$dir"
            after=$(versions "$dir")
            rows+=$(version_rows "$dir" "$before" "$after")$'\n'
          done
          {
            echo "body<<EOF"
            version_body 'Automated `nix flake update` for all templates.' "$rows"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify dev shells still evaluate
        run: |
          set -euo pipefail
          for dir in java*-maven; do
            echo "== $dir"
            nix develop "./$dir" --command true
          done

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-flake-lock
          delete-branch: true
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          labels: |
            automated
            dependencies
          body: ${{ steps.update.outputs.body }}

  update-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Update root lock
        id: update
        run: |
          set -euo pipefail
          source .github/scripts/version-table.sh

          versions() {
            nix eval --inputs-from . --json 'nixpkgs#legacyPackages.x86_64-linux' \
              --apply 'pkgs: map (n: { name = n; version = pkgs.${n}.version or null; }) ["treefmt" "nixfmt" "deadnix" "statix"]' \
              | jq -c 'map(select(.version != null))'
          }

          before=$(versions)
          nix flake update
          after=$(versions)
          rows=$(version_rows root "$before" "$after")
          {
            echo "body<<EOF"
            version_body 'Automated `nix flake update` for the root flake, which pins the formatter and git hooks tooling.' "$rows"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify checks still pass
        run: nix flake check . --show-trace

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-root-flake-lock
          delete-branch: true
          commit-message: "chore: update root flake.lock"
          title: "chore: update root flake.lock"
          labels: |
            automated
            dependencies
          body: ${{ steps.update.outputs.body }}
