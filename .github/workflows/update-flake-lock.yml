name: Update flake.lock

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Update all template locks
        id: update
        run: |
          set -euo pipefail

          versions() {
            nix eval --json "./$1#devShells.x86_64-linux.default.nativeBuildInputs" \
              --apply 'ps: map (p: { name = p.pname or p.name; version = p.version or null; }) ps' \
              | jq -c 'map(select(.version != null))'
          }

          rows=""
          for dir in java*-maven; do
            echo "== $dir"
            before=$(versions "$dir")
            nix flake update --flake "./$dir"
            after=$(versions "$dir")
            rows+=$(jq -rn --arg dir "$dir" --argjson before "$before" --argjson after "$after" '
              ($before | map({(.name): .version}) | add) as $old
              | $after[]
              | "| \($dir) | \(.name) | `\($old[.name] // "N/A")` | `\(.version)`\(if $old[.name] != .version then " :arrow_up:" else "" end) |"
            ')$'\n'
          done
          {
            echo "body<<EOF"
            echo "Automated \`nix flake update\` for all templates."
            echo
            echo "## Package Versions"
            echo
            echo "| Template | Package | Old | New |"
            echo "|----------|---------|-----|-----|"
            printf '%s' "$rows"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify dev shells still evaluate
        run: |
          set -euo pipefail
          for dir in java*-maven; do
            echo "== $dir"
            nix develop "./$dir" --command true
          done

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-flake-lock
          delete-branch: true
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          labels: |
            automated
            dependencies
          body: ${{ steps.update.outputs.body }}
